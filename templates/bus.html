{% extends "base.html" %}
{% block content %}
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
 var socket = io();
 function book(id){
   socket.emit("book_seat",{seat_id:id});
 }
 socket.on("seat_update",()=>location.reload());
</script>

{% for s in seats %}
Seat {{ s.seat_no }} - {{ s.status }}
<button onclick="book({{ s.id }})">Book</button><br>
{% endfor %}
{% endblock %}
