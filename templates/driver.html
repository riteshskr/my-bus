<!-- driver-app.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Driver GPS - Always Active</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            background: #000;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .status {
            font-size: 24px;
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #333;
        }
        .coords {
            font-family: monospace;
            font-size: 18px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>🚌 Driver GPS Tracker</h1>
    
    <div class="status" id="status">Starting GPS...</div>
    
    <div class="coords" id="coords">-</div>
    <div class="coords" id="speed">Speed: 0 km/h</div>
    <div class="coords" id="time">Time: -</div>
    
    <button onclick="startService()" style="padding:15px;margin:10px;">▶ Start Service</button>
    <button onclick="stopService()" style="padding:15px;margin:10px;">⏹ Stop Service</button>
    
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const socket = io(window.location.origin);
        const busId = new URLSearchParams(window.location.search).get('bus_id') || 1;
        
        let watchId = null;
        let wakeLock = null;
        let serviceWorker = null;
        
        // 🔥 स्क्रीन ऑन रखने का प्रयास
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active');
                }
            } catch (err) {
                console.log('Wake Lock failed:', err);
            }
        }
        
        // 🔥 बैकग्राउंड सर्विस
        async function startService() {
            // 1. Wake Lock
            await requestWakeLock();
            
            // 2. Service Worker रजिस्टर करें
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/sw-driver.js');
                    serviceWorker = registration.active;
                    console.log('Service Worker registered');
                } catch (err) {
                    console.log('Service Worker registration failed:', err);
                }
            }
            
            // 3. Background Sync API
            if ('sync' in registration) {
                registration.sync.register('gps-sync');
            }
            
            // 4. GPS शुरू करें
            startGPS();
            
            // 5. Visibility change handle करें
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    console.log('App in background, but GPS continues...');
                } else {
                    console.log('App in foreground');
                }
            });
        }
        
        function startGPS() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            
            const options = {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            };
            
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const speed = position.coords.speed || 0;
                    
                    // UI अपडेट
                    document.getElementById('coords').textContent = 
                        `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
                    document.getElementById('speed').textContent = 
                        `Speed: ${(speed * 3.6).toFixed(1)} km/h`;
                    document.getElementById('time').textContent = 
                        `Time: ${new Date().toLocaleTimeString()}`;
                    document.getElementById('status').textContent = 
                        '🟢 LIVE GPS Running';
                    
                    // सर्वर को भेजें
                    socket.emit('driver_gps', {
                        sid: busId,
                        lat: lat,
                        lng: lng,
                        speed: (speed * 3.6).toFixed(1),
                        timestamp: Date.now()
                    });
                    
                    // 🔥 LocalStorage में सेव करें (fallback)
                    localStorage.setItem('last_gps', JSON.stringify({
                        lat, lng, speed, time: Date.now()
                    }));
                    
                    // 🔥 Background sync के लिए IndexedDB में सेव
                    saveToIndexedDB({ lat, lng, speed, time: Date.now() });
                },
                (error) => {
                    console.error('GPS Error:', error);
                    document.getElementById('status').textContent = 
                        '🔴 GPS Error: ' + error.message;
                },
                options
            );
            
            // 🔥 Periodic backup (हर 30 सेकंड)
            setInterval(() => {
                const lastGPS = localStorage.getItem('last_gps');
                if (lastGPS) {
                    const data = JSON.parse(lastGPS);
                    socket.emit('driver_gps_backup', {
                        sid: busId,
                        ...data
                    });
                }
            }, 30000);
        }
        
        function stopService() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (wakeLock) wakeLock.release();
            document.getElementById('status').textContent = '⏹ GPS Stopped';
        }
        
        // IndexedDB setup
        function saveToIndexedDB(data) {
            const request = indexedDB.open('GPS_DB', 1);
            
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('locations')) {
                    db.createObjectStore('locations', { keyPath: 'id', autoIncrement: true });
                }
            };
            
            request.onsuccess = (event) => {
                const db = event.target.result;
                const tx = db.transaction('locations', 'readwrite');
                const store = tx.objectStore('locations');
                store.add({
                    ...data,
                    busId: busId,
                    timestamp: Date.now()
                });
            };
        }
        
        // ऐप लोड होते ही शुरू
        window.addEventListener('load', () => {
            startService();
        });
    </script>
</body>
</html>
