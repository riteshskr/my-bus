<!DOCTYPE html>
<html>
<head>
    <title>View Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>View Bookings</h2>

<a href="/export-bookings" class="btn btn-success mb-3">Export to Excel</a>

<form method="GET" class="row g-3 mb-4">

  <div class="col-md-2">
    <input type="date" name="date_from" class="form-control">
  </div>

  <div class="col-md-2">
    <input type="date" name="date_to" class="form-control">
  </div>

  <div class="col-md-3">
    <select name="route_id" id="routeSelect" class="form-control">
      <option value="">All Routes</option>
      {% for route in routes %}
      <option value="{{ route.id }}">{{ route.route_name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-3">
    <select name="bus_name" id="busSelect" class="form-control">
      <option value="">All Buses</option>
    </select>
  </div>

  <div class="col-md-2">
    <button class="btn btn-primary w-100">Filter</button>
  </div>

</form>


<h5 class="text-success">
  Total Collection: ₹ {{ total_amount }}
</h5>


<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>ID</th>
      <th>Customer</th>
      <th>Route</th>
      <th>Bus</th>
      <th>Date</th>
      <th>Seat</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    {% for b in bookings %}
    <tr>
      <td>{{ b.id }}</td>
      <td>{{ b.customer_name }}</td>
      <td>{{ route_dict[b.route_id] }}</td>
      <td>{{ b.bus_name }}</td>
      <td>{{ b.journey_date }}</td>
      <td>{{ b.seat_number }}</td>
      <td>{{ b.total_amount }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>


<script>
  const schedules = {{ schedules|tojson }};
  const routeSelect = document.getElementById("routeSelect");
  const busSelect = document.getElementById("busSelect");

  routeSelect.addEventListener("change", function () {
    const selectedRoute = this.value;
    busSelect.innerHTML = '<option value="">All Buses</option>';

    schedules.forEach(function (s) {
      if (s.route_id == selectedRoute) {
        const option = document.createElement("option");
        option.value = s.bus_name;
        option.text = s.bus_name;
        busSelect.appendChild(option);
      }
    });
  });
</script>

</body>
</html>
