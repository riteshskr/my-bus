<!DOCTYPE html>
<html>
<head>
    <title>Seat Selection - {{ schedule.bus_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
        }
        @media (max-width: 768px) {
            .seat-grid { grid-template-columns: repeat(5, 1fr); }
        }
        button.seat-btn {
            padding: 10px 0;
            border-radius: 6px;
            font-weight: bold;
        }
        button.seat-btn:disabled {
            cursor: not-allowed;
        }
        #bookingForm {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
        #map {
            height: 300px;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container my-4">

    <!-- Schedule Card -->
    <div class="card mb-4">
        <div class="card-body">
            <h3>{{ schedule.bus_name }}</h3>
            <p class="text-muted">
                Route: {{ schedule.route_name }} | Departure: {{ schedule.Departure: {{ bus.departure_time.strftime('%H:%M') }}

            </p>
            <p>Travel Date: {{ today }}</p>
        </div>
    </div>

    <!-- Bus Location Map -->
    <div class="card mb-4">
        <div class="card-body">
            <h4>Live Bus Location</h4>
            <div id="map"></div>
        </div>
    </div>

    <!-- Seat Selection Card -->
    <div class="card mb-4">
        <div class="card-body">
            <h4 class="mb-4">Select Your Seat</h4>
            <div class="seat-grid mb-4">
                {{ seat_buttons|safe }}
            </div>

            <!-- Booking Form -->
            <div id="bookingForm" style="display:none;">
                <h5>Passenger Details</h5>
                <form id="passengerForm">
                    <input type="hidden" id="selectedSeat" value="">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Passenger Name</label>
                            <input type="text" id="passengerName" class="form-control" placeholder="Enter Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Mobile Number</label>
                            <input type="tel" id="mobileNumber" class="form-control" placeholder="Enter Mobile" required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="confirmBooking()">
                        Confirm Booking
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
let selectedSeat = null;

// ===== Select Seat =====
function selectSeat(seatNumber){
    selectedSeat = seatNumber;
    document.getElementById('selectedSeat').value = seatNumber;
    document.getElementById('bookingForm').style.display = 'block';
    window.scrollTo({ top: document.getElementById('bookingForm').offsetTop, behavior: 'smooth' });
}

// ===== Confirm Booking =====
function confirmBooking(){
    const seatNumber = document.getElementById('selectedSeat').value;
    const passengerName = document.getElementById('passengerName').value.trim();
    const mobileNumber = document.getElementById('mobileNumber').value.trim();

    if(!passengerName || !mobileNumber){
        alert('Please fill all details');
        return;
    }

    fetch('/book',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            schedule_id: {{ schedule.id }},
            seat_number: seatNumber,
            passenger_name: passengerName,
            mobile: mobileNumber,
            date: '{{ today }}'
        })
    })
    .then(r => r.json())
    .then(data => {
        if(data.ok){
            alert('Booking confirmed! Fare: ₹' + data.fare);
            // Emit seat update via Socket.IO (optional server-side)
            socket.emit('seat_booked', {sid: {{ schedule.id }}, seat: seatNumber, date: '{{ today }}'});
            location.reload();
        } else {
            alert('Error: ' + data.error);
        }
    }).catch(err=>{
        console.error(err);
        alert('Network error, try again');
    });
}

// ===== Leaflet Map =====
const busLat = {{ schedule.current_lat or 22.97 }};
const busLng = {{ schedule.current_lng or 78.65 }};
const map = L.map('map').setView([busLat, busLng], 15);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    maxZoom: 19
}).addTo(map);

const busMarker = L.marker([busLat, busLng]).addTo(map).bindPopup("Bus Location");

// ===== Socket.IO =====
const socket = io(window.location.origin);

// Bus Location Updates
socket.on('bus_location', function(data){
    if(data.sid == {{ schedule.id }}){
        const lat = parseFloat(data.lat);
        const lng = parseFloat(data.lng);
        busMarker.setLatLng([lat,lng]);
        map.flyTo([lat,lng], map.getZoom());
    }
});

// Seat Updates Realtime
socket.on('seat_update', function(data){
    if(data.sid == {{ schedule.id }} && data.date == '{{ today }}'){
        const btn = document.querySelector('.seat-grid button:nth-child(' + data.seat + ')');
        if(btn){
            btn.classList.remove('btn-success');
            btn.classList.add('btn-danger');
            btn.disabled = true;
            btn.innerText = "X" + data.seat;
        }
    }
});
</script>
</body>
</html>
