<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bus Seat Booking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ===== Map ===== -->
<div id="map" style="
    width:100%;
    max-width:900px;
    height:300px;
    border-radius:12px;
    overflow:hidden;
    margin:20px auto;
"></div>

<div class="container" style="max-width:900px;">
    <h2>बस: राजस्थान रोडवेज | Route: जयपुर → उदयपुर</h2>
    <h4>Departure: 08:30</h4>
    <h5>
        Role:
        <span class="text-success fw-bold">
            {{ session.get('role','guest').upper() }}
        </span>
    </h5>

    <h5 class="mt-4">Select Seat</h5>
    <div class="d-flex flex-wrap gap-2">
        {% for i in range(1,37) %}
        <button id="seat-{{ i }}" 
                class="btn btn-success btn-lg"
                style="width:60px;height:60px;"
                onclick="bookSeat({{ i }})">
            {{ i }}
        </button>
        {% endfor %}
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const BUS_LAT = 26.9124;
const BUS_LNG = 75.7873;
const SID = {{ sid }};
const TODAY = "{{ travel_date }}";
const USER_ROLE = "{{ session.get('role','guest') }}";

const socket = io({
   transports: ["websocket"],
   reconnectionAttempts: 5
});

// ===== Map =====
const map = L.map('map').setView([BUS_LAT, BUS_LNG], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
let busMarker = L.marker([BUS_LAT, BUS_LNG]).addTo(map);

// ===== Realtime Seat Updates =====
socket.on("seat_update", data => {
    if(data.sid != SID || data.date != TODAY) return;
    lockSeat(data.seat);
});

// ===== Lock seat function =====
function lockSeat(seat){
    let btn = document.getElementById("seat-" + seat);
    if(!btn) return;
    btn.classList.remove("btn-success");
    btn.classList.add("btn-danger");
    btn.innerText = "X" + seat;
    btn.disabled = true;
}

// ===== Book Seat =====
function bookSeat(seat){
    let name = prompt("Passenger Name:");
    if(!name) return;

    let mobile = prompt("Mobile:");
    if(!mobile) return;

    let fare = 0;
    let payment_mode = "cash";

    if(USER_ROLE === "counter"){
        fare = parseInt(prompt("Fare:"));
        payment_mode = prompt("Payment: cash/online","cash");
    }

    fetch("/book",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            schedule_id:SID,
            seat_number:seat,
            passenger_name:name,
            mobile:mobile,
            date:TODAY,
            fare:fare,
            payment_mode:payment_mode
        })
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.ok){
            lockSeat(seat);
            alert("Booked");
        }else{
            alert(d.error);
        }
    });
}

// ===== Initial booked seats =====
const BOOKED = {{ booked_seats | tojson }};
BOOKED.forEach(b => lockSeat(b.seat_number));

// ===== heartbeat (light) =====
setInterval(()=>{ fetch("/heartbeat"); }, 120000);
</script>
</body>
</html>
