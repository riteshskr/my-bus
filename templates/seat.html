<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seat Selection - {{ schedule.bus_name }}</title>
    <style>
        .booked { background: red; color: white; margin: 5px; }
        .free { background: green; color: white; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Bus: {{ schedule.bus_name }}</h2>
    <p>Route: {{ schedule.route_name }} | Departure: {{ schedule.departure_time.strftime('%H:%M') }}</p>
    <p>Date: {{ today }}</p>

    <div id="seats">
        {{ seat_html|safe }}
    </div>

    <script>
        function selectSeat(seatNum) {
            alert("You selected seat " + seatNum);
            // यहाँ AJAX call या form submit कर सकते हो
        }
    </script>
</body>
</html>
