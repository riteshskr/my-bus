<!DOCTYPE html>
<html>
<head>
    <title>Seat Booking</title>
    <style>
        body { font-family: Arial; background:#f5f5f5; }
        .container { max-width:600px; margin:40px auto; background:white; padding:20px; border-radius:10px; }
        button { margin:5px; padding:10px 14px; border:none; border-radius:6px; cursor:pointer; }
        button[disabled] { background:#ccc; cursor:not-allowed; }
        .free { background:#4caf50; color:white; }
        .booked { background:#e53935; color:white; }
    </style>
</head>
<body>

<div class="container">
    <h2>बस: {{ bus_name }}</h2>

    <div id="seats">
        {{ seat_html|safe }}
    </div>

    <hr>

    <form id="bookForm" style="display:none">
        <h3>Booking Details</h3>
        <p>Seat: <input id="seat" readonly></p>
        <p>Name: <input id="name" placeholder="Passenger Name"></p>
        <button type="button" onclick="book()">Confirm Booking</button>
    </form>
</div>

<script>
let selectedSeat = null;

function selectSeat(x){
    selectedSeat = x;
    document.getElementById("seat").value = x;
    document.getElementById("bookForm").style.display = "block";
}

function book(){
    let name = document.getElementById("name").value;
    if(!name){
        alert("नाम डालो");
        return;
    }

    fetch("/book", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            schedule_id: {{ sid }},
            seat_number: selectedSeat,
            passenger_name: name,
            date: "{{ today }}"
        })
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.error){
            alert(d.error);
        } else {
            alert("Seat Booked Successfully!");
            location.reload();
        }
    });
}
</script>

</body>
</html>
