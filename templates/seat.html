<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seat Selection - {{ schedule.bus_name }}</title>
    <style>
        button { padding: 10px 15px; margin: 5px; font-size: 14px; cursor: pointer; }
        .booked { background-color: #f44336; color: white; cursor: not-allowed; }
        .free { background-color: #4CAF50; color: white; }
        .selected { background-color: #2196F3; color: white; }
    </style>
</head>
<body>
    <h2>Bus: {{ schedule.bus_name }}</h2>
    <p>Route: {{ schedule.route_name }} | Departure: {{ schedule.departure_time.strftime('%H:%M') }} | Date: {{ today }}</p>

    <h3>Select Your Seat:</h3>
    <div id="seats">
        {{ seat_html | safe }}
    </div>

    <p>Selected Seat: <span id="selectedSeat">None</span></p>

    <script>
        let selectedSeat = null;

        function selectSeat(seatNumber) {
            if(selectedSeat !== null) {
                document.querySelector(`#seat-${selectedSeat}`).classList.remove('selected');
            }
            selectedSeat = seatNumber;
            document.querySelector(`#seat-${seatNumber}`).classList.add('selected');
            document.getElementById("selectedSeat").innerText = "S" + seatNumber;
        }

        // Add ids to seat buttons dynamically
        document.querySelectorAll("#seats button").forEach(btn => {
            const seatNum = btn.innerText.replace('S','').replace(' ❌','');
            btn.id = "seat-" + seatNum;
        });
    </script>
</body>
</html>
