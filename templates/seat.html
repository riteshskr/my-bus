<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const SID = 1;  // Schedule ID
const TODAY = "2026-02-10";
const BUS_LAT = 26.9124;  // Jaipur coords
const BUS_LNG = 75.7873;
const COUNTER_ID = 1;  // Demo counter ID

// ===== Leaflet Map Init =====
const map = L.map('map').setView([BUS_LAT, BUS_LNG], 15);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
}).addTo(map);

let busMarker = L.marker([BUS_LAT, BUS_LNG]).addTo(map)
    .bindPopup('Live Bus Location')
    .openPopup();

// ===== Demo Socket Events (Backend connect करेंगे बाद में) =====
function simulateBusMovement() {
    setInterval(() => {
        const newLat = BUS_LAT + (Math.random() - 0.5) * 0.01;
        const newLng = BUS_LNG + (Math.random() - 0.5) * 0.01;
        busMarker.setLatLng([newLat, newLng]);
        map.flyTo([newLat, newLng], 15);
    }, 5000);
}
simulateBusMovement();

// ===== Seat Booking Function =====
function bookSeat(seatId) {
    let name = prompt("Passenger Name:");
    if(!name) return;

    let mobile = prompt("Mobile Number:");
    if(!mobile) return;

    let btn = document.getElementById("seat-" + seatId);
    let oldText = btn.innerText;
    btn.innerText = "⏳ Booking...";
    btn.disabled = true;
    
    let fare = null;
    let payment_mode = "cash";
    
    // Counter role - fare input
    if(COUNTER_ID !== null) {
        fare = prompt("Fare amount:");
        if(!fare || isNaN(fare)) {
            alert("Invalid fare");
            resetButton();
            return;
        }
        payment_mode = prompt("Payment mode: cash / online", "cash");
        if(payment_mode !== "cash" && payment_mode !== "online") {
            alert("Only cash or online allowed");
            resetButton();
            return;
        }
    }
    
    function resetButton() {
        btn.innerText = oldText;
        btn.disabled = false;
    }
    
    // Demo booking success
    fetch("https://my-bus-hps7.onrender.com/book", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        schedule_id: SID,
        seat_number: seatId,
        passenger_name: name,
        mobile: mobile,
        date: TODAY
    })
})
.then(r => r.json())
.then(d => {
    if(d.ok){
        btn.classList.remove("btn-success");
        btn.classList.add("btn-danger");
        btn.innerText = "X" + seatId;
        alert(d.message || "Seat booked");
    } else {
        alert(d.error || "Booking failed");
        resetButton();
    }
})
.catch(err => {
    alert("Server error");
    resetButton();
});
}

// ===== Heartbeat =====
setInterval(() => {
    console.log("Heartbeat sent");
}, 30000);

</script>
